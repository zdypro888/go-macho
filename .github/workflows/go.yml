name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    name: Build
    runs-on: macos-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: "stable"

    - name: Test
      run: go test ./...
